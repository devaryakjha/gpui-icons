[package]
name = "gpui-icons"
version = "0.4.0"
edition = "2024"
rust-version = "1.97.1"
description = "The complete, embedded Lucide icon set for GPUI."
repository = "https://github.com/devaryakjha/gpui-icons"
readme = "README.md"
license = "MIT AND ISC"
keywords = ["gpui", "icons", "lucide"]
categories = ["gui"]
include = [
  "src/**",
  "scripts/**",
  "assets/**",
  "LICENSES/**",
  "LICENSE",
  "README.md",
  "RELEASE-MANIFEST.json",
  "Cargo.toml",
]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.4" }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"

[lints.rust]
missing_docs = "deny"
