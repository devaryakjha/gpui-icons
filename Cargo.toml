[package]
name = "gpui-icons"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "The complete, embedded Lucide icon set for GPUI."
repository = "https://github.com/devaryakjha/gpui-icons"
readme = "README.md"
license = "MIT AND ISC"
keywords = ["gpui", "icons", "lucide"]
categories = ["gui"]
include = [
  "src/**",
  "scripts/**",
  "assets/**",
  "LICENSES/**",
  "LICENSE",
  "README.md",
  "RELEASE-MANIFEST.json",
  "Cargo.toml",
]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "59b2ebf10351b5c0b5cd4403f01ed0460eeec06d", package = "gpui" }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"

[lints.rust]
missing_docs = "deny"
