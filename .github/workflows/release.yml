name: Release

# Merging a version bump to main is the release. Every push to main runs CI
# (T2) here, and the release starts only when it passes. When v<version> is
# already fully released, nothing happens; when an earlier run tagged it and
# then failed, this run finishes it. It tags the commit, publishes gpui-icons
# to crates.io, publishes the GitHub release, then opens gpuicn's pin bump
# pull request. Every step skips work that is already done, so "Re-run
# failed jobs" is safe. It runs CI itself instead of listening for CI's
# workflow_run event: crates.io Trusted Publishing refuses tokens to
# workflow_run triggers, and it trusts this file.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write # crates.io Trusted Publishing
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: plan
        uses: karyalabs/.github/actions/release-plan@v1
        with:
          crates: gpui-icons
      - if: steps.plan.outputs.release == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.sha }}
      - if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if [ -n "$(git ls-remote origin "refs/tags/$TAG")" ]; then
            echo "$TAG exists"
          else
            git push origin "HEAD:refs/tags/$TAG"
          fi
      - if: steps.plan.outputs.release == 'true'
        uses: karyalabs/.github/actions/rust-toolchain@v1
      - if: steps.plan.outputs.release == 'true'
        uses: karyalabs/.github/actions/crates-publish@v1
        with:
          crates: gpui-icons
          version: ${{ steps.plan.outputs.version }}
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" --verify-tag --title "gpui-icons $TAG" --generate-notes
          fi

  # gpuicn's own CI checks the new version in the pull request this opens.
  bump-gpuicn:
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: karyalabs/.github/actions/bump-downstream@v1
        with:
          repository: karyalabs/gpuicn
          crate: gpui-icons
          toolchain-file: release-pins.toml
          toolchain-key: rust.toolchain
          version: ${{ needs.release.outputs.version }}
          app-id: ${{ secrets.KARYA_BOT_APP_ID }}
          private-key: ${{ secrets.KARYA_BOT_PRIVATE_KEY }}
