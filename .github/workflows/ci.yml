name: CI

# The tiers of the Karya Labs engineering process (karyalabs/matty,
# docs/engineering-process.md, section 5.2):
#
# - T1, every pull request: fmt, clippy, and the release manifest agrees
#   with Cargo.toml.
# - T2, every push to main (from release.yml, before it releases): T1 plus
#   the tests and the MSRV check.
#
# The `tests` label runs T2 on a pull request. gpuicn is built against this
# tree in canary.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_call:

# A new push to a pull request cancels its older run. A label that is not
# `tests` gets a group of its own, so it never cancels a real run.
concurrency:
  group: >-
    ci-${{ github.event.pull_request.number || github.sha }}${{
    github.event.action == 'labeled' && github.event.label.name != 'tests' &&
    format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    if: github.event.action != 'labeled' || github.event.label.name == 'tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: karyalabs/.github/actions/rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The release manifest names the same version as Cargo.toml
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          manifest="$(python3 -c 'import json; print(json.load(open("RELEASE-MANIFEST.json"))["crate"]["version"])')"
          if [ "$version" != "$manifest" ]; then
            echo "::error::Cargo.toml says $version but RELEASE-MANIFEST.json says $manifest."
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'tests')
        run: cargo test --locked

  msrv:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'tests')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')" >>"$GITHUB_OUTPUT"
      - uses: karyalabs/.github/actions/rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked

  # The one check to wait on. A run for a label that is not `tests` checks
  # nothing itself, so it repeats the latest other `ci` result on the commit.
  ci:
    if: ${{ !cancelled() }}
    needs: [lint, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      - env:
          IGNORED: ${{ github.event.action == 'labeled' && github.event.label.name != 'tests' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ needs.lint.result }} ${{ needs.msrv.result }}
        run: |
          if [ "$IGNORED" = true ]; then
            latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=ci&filter=all" \
              --jq "[.check_runs[] | select(.details_url | contains(\"/runs/$GITHUB_RUN_ID/\") | not)] | sort_by(.started_at) | last | .conclusion // \"\"")"
            echo "The latest other ci check on ${SHA::7}: ${latest:-none or still running}"
            [ "$latest" != failure ] && [ "$latest" != timed_out ]
            exit
          fi
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
