name: CI

# The tiers of the Karya Labs engineering process (karyalabs/matty,
# docs/engineering-process.md, section 5.2):
#
# - T1, every pull request: fmt, clippy, and the release manifest agrees
#   with Cargo.toml.
# - T2, the merge queue and every push to main (from release.yml, before
#   it releases): T1 plus
#   the tests and the MSRV check.
#
# The `tests` label runs T2 on a pull request (add it, then push). gpuicn is built against this
# tree in canary.yml.
on:
  pull_request:
  # The merge queue checks the tree about to land.
  merge_group:
  workflow_call:

# A new push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: karyalabs/.github/actions/rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The release manifest names the same version as Cargo.toml
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          manifest="$(python3 -c 'import json; print(json.load(open("RELEASE-MANIFEST.json"))["crate"]["version"])')"
          if [ "$version" != "$manifest" ]; then
            echo "::error::Cargo.toml says $version but RELEASE-MANIFEST.json says $manifest."
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'tests')
        run: cargo test --locked

  msrv:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'tests')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')" >>"$GITHUB_OUTPUT"
      - uses: karyalabs/.github/actions/rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked

  # The one check to wait on.
  ci:
    if: ${{ !cancelled() }}
    needs: [lint, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.lint.result }} ${{ needs.msrv.result }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
